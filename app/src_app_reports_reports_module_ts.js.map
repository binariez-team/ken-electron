<p-panel header="Inventory Status">
    <p-toolbar styleClass="p-1" *ngIf="inventoryValue">
        <ng-template pTemplate="left">
            <h3 class="m-1">
                Inventory Value:
                {{ inventoryValue.inventory_value | currency }}
            </h3>
        </ng-template>
    </p-toolbar>
    <p-toolbar styleClass="p-1 mt-1" *ngIf="inventoryValue">
        <ng-template pTemplate="left">
            <h3 class="m-1">
                Remaining Items:
                {{ inventoryValue.nb_items }}
            </h3>
        </ng-template>
    </p-toolbar>
    <!-- <p-messages
        [(value)]="emptyReportMessage"
        [closable]="false"
        *ngIf="!inventoryValue"
    ></p-messages> -->
</p-panel>
