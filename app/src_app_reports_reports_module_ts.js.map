<div class="grid">
    <div class="col-12">
        <p-card>
            <ng-template pTemplate="body">
                <form
                    [formGroup]="auxiliaryStatementsForm"
                    (ngSubmit)="submitForm()"
                >
                    <div class="grid">
                        <!-- dates -->
                        <div class="col-3">
                            <div class="field grid">
                                <label class="col-fixed" style="width: 50px"
                                    >From:</label
                                >
                                <div class="col">
                                    <p-calendar
                                        styleClass="p-inputtext-sm"
                                        formControlName="startDate"
                                        [showIcon]="true"
                                        [iconDisplay]="'input'"
                                        dateFormat="yy-mm-dd"
                                        [readonlyInput]="true"
                                    ></p-calendar>
                                </div>
                            </div>
                        </div>

                        <div class="col-3">
                            <div class="field grid">
                                <label class="col-fixed" style="width: 50px"
                                    >To:</label
                                >
                                <div class="col">
                                    <p-calendar
                                        styleClass="p-inputtext-sm"
                                        formControlName="endDate"
                                        [showIcon]="true"
                                        [iconDisplay]="'input'"
                                        dateFormat="yy-mm-dd"
                                        [readonlyInput]="true"
                                    ></p-calendar>
                                </div>
                            </div>
                        </div>

                        <!-- options -->
                        <div class="col-3">
                            <div class="field-checkbox">
                                <p-checkbox
                                    formControlName="showZero"
                                    [binary]="true"
                                    inputId="zero"
                                />
                                <label for="zero">Show zero accounts?</label>
                            </div>
                        </div>
                        <div class="col-3">
                            <button pButton pRipple label="Submit"></button>
                        </div>
                    </div>
                </form>
            </ng-template>
        </p-card>
    </div>
    <div class="col-12">
        <p-card>
            <p-toolbar styleClass="p-2">
                <div class="p-toolbar-group-start">
                    <h4 class="m-0">Auxiliary Statements</h4>
                </div>

                <div class="p-toolbar-group-center">
                    <p-button
                        severity="contrast"
                        size="small"
                        label="Print"
                        icon="pi pi-print"
                        (onClick)="printAuxiliaryStatement()"
                    />
                </div>

                <div class="p-toolbar-group-end">
                    <p-selectButton
                        [options]="currencyOptions"
                        [(ngModel)]="currencyValue"
                        optionLabel="label"
                        optionValue="value"
                        [allowEmpty]="false"
                        (onChange)="changeCurrency($event)"
                    />
                </div>
            </p-toolbar>
            <p-table
                [value]="auxiliaryDetails"
                dataKey="id"
                styleClass="p-datatable-sm"
                [scrollable]="true"
                scrollHeight="400px"
                [loading]="auxiliaryStatementsLoading"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th>Account #</th>
                        <th>Name</th>
                        <th>End Debit</th>
                        <th>End Credit</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-record>
                    <tr class="trial_expanded_row">
                        <td>
                            {{ record.partner_id_fk }}
                        </td>
                        <td>
                            {{ record.partner_name }}
                        </td>
                        <td>
                            <span *ngIf="currencyValue === 'USD'">
                                {{ record.end_debit | currency }}
                            </span>
                            <span *ngIf="currencyValue === 'LBP'">
                                {{ record.end_debit_lbp | lira }}
                            </span>
                        </td>
                        <td>
                            <span *ngIf="currencyValue === 'USD'">
                                {{ record.end_credit | currency }}
                            </span>
                            <span *ngIf="currencyValue === 'LBP'">
                                {{ record.end_credit_lbp | lira }}
                            </span>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>
