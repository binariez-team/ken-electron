<p-toolbar styleClass="p-3">
    <ng-template pTemplate="left">
        <label class="mr-2">Start Date:</label>
        <p-calendar
            styleClass="p-inputtext-sm"
            [(ngModel)]="startDate"
            [showIcon]="true"
            dateFormat="yy-mm-dd"
            [readonlyInput]="true"
            (onSelect)="startDateChanged()"
        ></p-calendar>
    </ng-template>

    <ng-template pTemplate="center">
        <p-button
            (onClick)="selectToday()"
            label="Today"
            severity="secondary"
            [size]="'small'"
        />
        <p-button
            (onClick)="selectThisMonth()"
            styleClass="mx-2"
            label="This Month"
            severity="secondary"
            [size]="'small'"
        />
        <p-button
            (onClick)="selectThisYear()"
            label="This Year"
            severity="secondary"
            [size]="'small'"
        />
    </ng-template>

    <ng-template pTemplate="right">
        <label class="mr-2">End Date:</label>
        <p-calendar
            styleClass="p-inputtext-sm"
            [(ngModel)]="endDate"
            [showIcon]="true"
            dateFormat="yy-mm-dd"
            [readonlyInput]="true"
            (onSelect)="endDateChanged()"
        ></p-calendar>
    </ng-template>
</p-toolbar>
