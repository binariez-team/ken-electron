<div class="grid">
    <div class="col-12">
        <report-dates></report-dates>
    </div>

    <div class="col-12 md:col-12">
        <p-panel header="Top Items Sold">
            <div class="flex">
                <span class="p-input-icon-left mr-auto">
                    <i class="pi pi-search"></i>
                    <input
                        #tableSearch
                        pInputText
                        class="p-inputtext-sm"
                        type="search"
                        (input)="
                            dt2.filterGlobal(
                                $any($event.target).value,
                                'contains'
                            )
                        "
                        placeholder="Search ..."
                        spellcheck="false"
                        [value]="$any(dt2.filters['global'])?.value"
                    />
                </span>

                <p-dropdown
                    styleClass="p-inputtext-sm"
                    id="customer"
                    appendTo="body"
                    [options]="customers"
                    (onChange)="customerChange($event.value)"
                    optionLabel="name"
                    optionValue="account_id"
                    placeholder="Select Customer"
                    [filter]="true"
                    [showClear]="true"
                    filterBy="name"
                ></p-dropdown>
            </div>
            <br />
            <p-table
                #dt2
                class="p-datatable-sm p-datatable-striped"
                [value]="topItems"
                dataKey="item_id"
                [paginator]="true"
                [rows]="10"
                [showCurrentPageReport]="true"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} records"
                [rowsPerPageOptions]="[10, 15, 50, 100]"
                [alwaysShowPaginator]="false"
                [globalFilterFields]="['sku', 'item_name']"
                [filterDelay]="0"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th>SKU</th>
                        <th>Description</th>
                        <th>Count Sold</th>
                        <th>Avg Cost Sold</th>
                        <th>Total Cost Sold</th>
                        <th>Total Price Sold</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-record>
                    <tr>
                        <td>{{ record.sku }}</td>
                        <td>{{ record.item_name }}</td>
                        <td>{{ record.count }}</td>
                        <td>{{ record.unit_cost | currency }}</td>
                        <td>{{ record.total_cost | currency }}</td>
                        <td>{{ record.total_price | currency }}</td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="6">No records yet!</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-panel>
    </div>

    <div class="col-12 md:col-6">
        <p-panel header="Top Categories Sold">
            <p-chart
                type="doughnut"
                [data]="categoryData"
                [options]="categoryOptions"
            ></p-chart>
        </p-panel>
    </div>
</div>
