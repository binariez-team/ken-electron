<p-card>
    <div class="grid">
        <div class="col-2">
            <p-button
                label="New"
                icon="pi pi-plus"
                severity="success"
                size="small"
                styleClass="w-full"
                (onClick)="openLinkDialog('add')"
            />
        </div>

        <div class="col-6">
            <p-button
                label="Refresh"
                icon="pi pi-refresh"
                size="small"
                (onClick)="getLinks()"
            />
        </div>

        <div class="col-2">
            <p-button
                label="Edit"
                icon="pi pi-pencil"
                size="small"
                severity="warning"
                styleClass="w-full"
                (onClick)="openLinkDialog('edit')"
                [disabled]="!selectedLink()"
            />
        </div>

        <div class="col-2">
            <p-button
                label="Delete"
                icon="pi pi-trash"
                size="small"
                severity="danger"
                styleClass="w-full"
                [disabled]="!selectedLink()"
                (onClick)="deleteLink()"
            />
        </div>

        <!-- table -->

        <div class="col-12">
            <p-table
                [value]="links()"
                selectionMode="single"
                [(selection)]="selectedLink"
                dataKey="link_id"
                styleClass="p-datatable-sm"
                [loading]="loadingLinks()"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th>Description</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-record>
                    <tr [pSelectableRow]="record">
                        <td>{{ record.description }}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td>No Records !</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</p-card>

<p-dialog
    [(visible)]="linkDialogVisible"
    (onHide)="linkForm.reset()"
    header="Link"
    [modal]="true"
    [style]="{ width: '30vw' }"
    styleClass="p-fluid"
>
    <!-- body -->
    <ng-template pTemplate="content">
        <form [formGroup]="linkForm" (ngSubmit)="submitLink()">
            <div class="field mt-1">
                <label for="name">Description</label>
                <input
                    type="text"
                    pInputText
                    formControlName="description"
                    required
                    autofocus
                    spellcheck="false"
                />
            </div>
        </form>
    </ng-template>

    <!-- footer -->
    <ng-template pTemplate="footer">
        <p-button
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            (onClick)="linkDialogVisible.set(false)"
        />
        <p-button
            (onClick)="submitLink()"
            label="Save"
            icon="pi pi-check"
            severity="success"
        />
    </ng-template>
</p-dialog>

<p-confirmDialog key="links" [style]="{ width: '50vw' }"></p-confirmDialog>
