<div class="grid m-1">
    <div class="col-12">
        <p-toolbar styleClass="p-3">
            <ng-template pTemplate="left">
                <div class="flex">
                    <span class="p-input-icon-left mr-auto">
                        <i class="pi pi-search"></i>
                        <input
                            #tableSearch
                            pInputText
                            class="p-inputtext-sm"
                            type="search"
                            (input)="
                                at.filterGlobal(
                                    $any($event.target).value,
                                    'contains'
                                )
                            "
                            placeholder="Search ..."
                            [value]="$any(at.filters['global'])?.value"
                        />
                    </span>
                </div>

                <p-button
                    label="refresh"
                    icon="pi pi-refresh"
                    size="small"
                    severity="primary"
                    styleClass="ml-2"
                    (onClick)="refreshArchive()"
                />
            </ng-template>

            <ng-template pTemplate="right">
                <label class="mr-2">Start Date:</label>
                <p-calendar
                    styleClass="p-inputtext-sm mr-2"
                    [(ngModel)]="startDate"
                    [showIcon]="true"
                    dateFormat="yy-mm-dd"
                    [readonlyInput]="true"
                    (onSelect)="startDateChanged()"
                    [showButtonBar]="true"
                ></p-calendar>
                <label class="mr-2">End Date:</label>
                <p-calendar
                    styleClass="p-inputtext-sm mr-2"
                    [(ngModel)]="endDate"
                    [showIcon]="true"
                    dateFormat="yy-mm-dd"
                    [readonlyInput]="true"
                    (onSelect)="endDateChanged()"
                    [showButtonBar]="true"
                ></p-calendar>
            </ng-template>
        </p-toolbar>

        <p-table
            #at
            [value]="productArchive()"
            dataKey="product_id"
            styleClass="p-datatable-sm p-datatable-striped"
            [paginator]="true"
            [rows]="10"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} records"
            [rowsPerPageOptions]="[10, 15, 50, 100]"
            [alwaysShowPaginator]="true"
            [globalFilterFields]="['sku', 'product_name', 'barcode']"
            [filterDelay]="0"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th width="8%">SKU</th>
                    <th width="35%" pSortableColumn="product_name">
                        Product Name
                        <p-sortIcon field="product_name"></p-sortIcon>
                    </th>
                    <th width="10%" pSortableColumn="category_name">
                        Category <p-sortIcon field="category_name"></p-sortIcon>
                    </th>
                    <th width="7%" pSortableColumn="quantity">
                        Qty <p-sortIcon field="quantity"></p-sortIcon>
                    </th>
                    <th width="10%">Avg Cost</th>
                    <th width="10%" pSortableColumn="unit_price_usd">
                        Price <p-sortIcon field="unit_price_usd"></p-sortIcon>
                    </th>
                    <th width="10%" pSortableColumn="ttc_price">
                        TTC Price<p-sortIcon field="ttc_price"></p-sortIcon>
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-record>
                <tr>
                    <td>{{ record.sku || " --- " }}</td>
                    <td>{{ record.product_name }}</td>
                    <td>{{ record.category_name }}</td>
                    <td>{{ record.quantity }}</td>
                    <td>
                        {{ record.average_cost_usd | currency }}
                    </td>
                    <td>{{ record.unit_price_usd | currency }}</td>
                    <td>{{ record.ttc_price | currency }}</td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="7">No items yet!</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
