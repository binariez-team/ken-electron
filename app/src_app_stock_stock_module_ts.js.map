<p-toolbar>
    <div class="p-toolbar-group-start">
        <h3>
            Delivery Charge:
            <i class="text-green-600">{{ deliveryChargeValue() | currency }}</i>
        </h3>
    </div>
    <div class="p-toolbar-group-end">
        <p-button
            icon="pi pi-file-edit"
            styleClass="p-button-warning"
            label="Edit"
            (onClick)="toggleDialog(true)"
        ></p-button>
    </div>
</p-toolbar>

<p-dialog
    [(visible)]="deliveryChargeDialogVisible"
    (onHide)="resetDialog()"
    header="Delivery Charge"
    [modal]="true"
    [style]="{ width: '30vw' }"
    styleClass="p-fluid"
>
    <!-- body -->
    <ng-template pTemplate="content">
        <form [formGroup]="deliveryChargeForm" (ngSubmit)="submit()">
            <div class="field mt-1">
                <label for="name">Delivery Charge</label>
                <p-inputNumber
                    inputId="integeronly"
                    formControlName="setting_value"
                    [min]="1"
                ></p-inputNumber>
            </div>
        </form>
    </ng-template>

    <!-- footer -->
    <ng-template pTemplate="footer">
        <p-button
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            size="small"
            (onClick)="toggleDialog(false)"
        />
        <p-button
            label="Save"
            icon="pi pi-check"
            severity="success"
            size="small"
            (onClick)="submit()"
            [loading]="updateDeliveryLoading()"
        />
    </ng-template>
</p-dialog>
