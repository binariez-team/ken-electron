<p-dialog
    position="top"
    header="Transaction History"
    [modal]="true"
    [(visible)]="visible"
    [breakpoints]="{ '1199px': '85vw', '575px': '95vw' }"
    [style]="{ width: '75vw' }"
    styleClass="p-fluid"
    [closeOnEscape]="false"
    (onHide)="closeDialog()"
    [closable]="true"
    [maximizable]="true"
    (onShow)="fetchProductHistory()"
>
    <ng-template pTemplate="content">
        <p-table
            #dt2
            [value]="stockHistory()"
            styleClass="p-datatable-sm"
            dataKey="transaction_id"
            [paginator]="true"
            [rows]="10"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} records"
            [rowsPerPageOptions]="[10, 15, 50, 100]"
            [alwaysShowPaginator]="true"
            [globalFilterFields]="['product_name', 'barcode']"
            [filterDelay]="0"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th>Transaction</th>
                    <th>Name</th>
                    <th>Datetime</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Balance</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-record>
                <tr [pSelectableRow]="record">
                    <td>{{ record.transaction_notes || "---" }}</td>
                    <td>{{ record.account_name || "---" }}</td>
                    <td>{{ record.transaction_datetime }}</td>
                    <td>
                        <p-tag
                            [value]="record.transaction_type"
                            [severity]="getSeverity(record.transaction_type)"
                        />
                    </td>
                    <td>{{ record.quantity }}</td>
                    <td>{{ record.balance }}</td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="7">No records yet!</td>
                </tr>
            </ng-template>
        </p-table>
    </ng-template>
    <!-- footer -->
    <ng-template pTemplate="footer">
        <p-button
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            (onClick)="closeDialog()"
            size="small"
        />
    </ng-template>
</p-dialog>
