<p-toolbar>
    <div class="p-toolbar-group-start">
        <h3>
            Dollar Exchange:
            <i class="text-green-600">{{ exchangeRate.rate_value | lira }}</i>
        </h3>
    </div>
    <div class="p-toolbar-group-end">
        <p-button
            icon="pi pi-file-edit"
            styleClass="p-button-warning"
            label="Edit"
            (onClick)="toggleDialog(true)"
        ></p-button>
    </div>
</p-toolbar>

<p-dialog
    [(visible)]="rateDialogVisible"
    (onHide)="resetDialog()"
    header="Exchange Rate"
    [modal]="true"
    [style]="{ width: '30vw' }"
    styleClass="p-fluid"
>
    <!-- body -->
    <ng-template pTemplate="content">
        <form [formGroup]="rateForm" (ngSubmit)="submit()">
            <div class="field mt-1">
                <label for="name">Exchange Rate</label>
                <p-inputNumber
                    inputId="integeronly"
                    formControlName="rate_value"
                    [min]="1000"
                ></p-inputNumber>
            </div>
        </form>
    </ng-template>

    <!-- footer -->
    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            label="Cancel"
            icon="pi pi-times"
            class="p-button-secondary"
            (click)="toggleDialog(false)"
        ></button>
        <button
            (click)="submit()"
            pButton
            pRipple
            label="Save"
            icon="pi pi-check"
            class="p-button-success"
        ></button>
    </ng-template>
</p-dialog>
