<p-toolbar>
    <div class="p-toolbar-group-start">
        <!-- <h3>Graph for: {{ graphYear }}</h3> -->
        <div class="field grid">
            <label class="col-fixed" for="yearpicker">Graph</label>
            <div class="col-auto">
                <form [formGroup]="yearForm">
                    <p-calendar
                        name="yearpicker"
                        formControlName="year_picker"
                        view="year"
                        dateFormat="yy"
                        [readonlyInput]="true"
                        (onSelect)="changeYear()"
                        styleClass="p-inputtext-sm w-full"
                    ></p-calendar>
                </form>
            </div>
            <div class="col">
                <button
                    pButton
                    label="Now"
                    size="small"
                    (click)="setCurrentYear()"
                ></button>
            </div>
        </div>
        <!-- <form [formGroup]="yearForm">
            <label for="yearpicker">Graph</label>
            <p-calendar
                name="yearpicker"
                formControlName="year_picker"
                view="year"
                dateFormat="yy"
                [readonlyInput]="true"
                (onSelect)="changeYear()"
                styleClass="p-inputtext-sm"
            ></p-calendar>
        </form> -->
    </div>
    <!-- <div class="p-toolbar-group-center"></div>
    <div class="p-toolbar-group-end"></div> -->
</p-toolbar>
<br />
<p-card>
    <p-chart type="bar" [data]="data" [options]="options"></p-chart>
</p-card>
