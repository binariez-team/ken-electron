<div class="grid m-1">
    <div class="col-5">
        <p-panel header="Categories">
            <p-toolbar styleClass="mb-4 p-2">
                <!-- left -->
                <ng-template pTemplate="left">
                    <button
                        pButton
                        pRipple
                        label="New Category"
                        icon="pi pi-plus"
                        class="p-button-success mr-2 p-button-sm"
                        (click)="openCategoryDialog('add')"
                    ></button>
                </ng-template>

                <!-- right -->
                <ng-template pTemplate="right">
                    <button
                        (click)="openCategoryDialog('edit')"
                        pButton
                        pRipple
                        label="Edit"
                        icon="pi pi-file-edit"
                        class="p-button-warning p-button-sm mr-2"
                        [disabled]="!selectedCategory"
                    ></button>
                    <button
                        (click)="deleteSelectedCategory()"
                        pButton
                        pRipple
                        label="Delete"
                        icon="pi pi-trash"
                        class="p-button-danger p-button-sm"
                        [disabled]="!selectedCategory"
                    ></button>
                </ng-template>
            </p-toolbar>
            <p-table
                [value]="categories"
                selectionMode="single"
                [(selection)]="selectedCategory"
                dataKey="category_id"
                styleClass="p-datatable-sm"
                (onRowReorder)="sortCategories()"
                (onRowSelect)="selectCategory()"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th width="15%">Sort</th>
                        <th width="85%">Name</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-record>
                    <tr
                        [pReorderableRow]="record.category_index"
                        [pSelectableRow]="record"
                    >
                        <td>
                            <span
                                class="pi pi-bars"
                                pReorderableRowHandle
                            ></span>
                        </td>
                        <td>{{ record.category_name }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-panel>
    </div>

    <div class="col-7">
        <category-items *ngIf="selectedCategory"></category-items>
    </div>
</div>

<p-dialog
    [(visible)]="categoryDialogVisible"
    (onHide)="resetDialog()"
    header="Category"
    [modal]="true"
    [style]="{ width: '30vw' }"
    styleClass="p-fluid"
>
    <!-- body -->
    <ng-template pTemplate="content">
        <form [formGroup]="categoryForm" (ngSubmit)="submitCategory()">
            <div class="field mt-1">
                <label for="name">Category Name</label>
                <input
                    type="text"
                    pInputText
                    formControlName="category_name"
                    required
                    autofocus
                    spellcheck="false"
                />
                <small
                    *ngIf="
                        category_name.invalid &&
                        (category_name.dirty || category_name.touched)
                    "
                    class="p-error"
                    >Name is required.</small
                >
            </div>
            <div class="flex align-items-center justify-content-center gap-2">
                <p-inputSwitch
                    id="showOnSell"
                    formControlName="show_on_sell"
                ></p-inputSwitch>
                <label for="showOnSell">Show on sell page?</label>
            </div>
        </form>
    </ng-template>

    <!-- footer -->
    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            label="Cancel"
            icon="pi pi-times"
            class="p-button-secondary"
            (click)="categoryDialogVisible = false"
        ></button>
        <button
            (click)="submitCategory()"
            pButton
            pRipple
            label="Save"
            icon="pi pi-check"
            class="p-button-success"
        ></button>
    </ng-template>
</p-dialog>

<!-- toast and confirm dialog -->
<p-toast key="categories"></p-toast>
<p-confirmDialog
    key="deleteCategory"
    [style]="{ width: '50vw' }"
></p-confirmDialog>
