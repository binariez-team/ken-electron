<!-- HoldInvoiceBar -->
<p-toolbar styleClass="mb-1 p-2">
    <!-- left -->
    <div class="p-toolbar-group-start">
        <h2 class="text-green-500 m-2">Invoice {{ active_id }}</h2>
    </div>

    <!-- center -->
    <div class="p-toolbar-group-center flex-grow-1">
        <p-scroller
            #sc
            [items]="items"
            [itemSize]="50"
            [lazy]="true"
            scrollHeight="50px"
            orientation="horizontal"
            styleClass="border-1 surface-border w-full"
            class="w-full"
            [autoSize]="true"
            [style]="{ width: '100%', height: '50px' }"
        >
            <ng-template pTemplate="item" let-item let-options="options">
                <div
                    class="flex align-items-center p-2 dark-hover"
                    style="height: 48px; min-width: fit-content"
                    [ngClass]="{
                        'active-tab': active_index === options.index,
                        'surface-100':
                            options.odd && active_index !== options.index
                    }"
                    (click)="changeActiveInvoice(options.index)"
                >
                    Invoice #{{ item.order_id }}

                    <i
                        *ngIf="!options.last"
                        class="pi pi-times-circle text-red-500 ml-2 cursor-pointer"
                        (click)="deleteInvoice(options.index)"
                    ></i>
                    <!-- <p-button
                        icon="pi pi-times"
                        size="small"
                        [rounded]="true"
                        [text]="true"
                        severity="danger "
                        (click)="deleteInvoice(options.index)"
                    ></p-button> -->
                </div>
            </ng-template>
        </p-scroller>
    </div>

    <!-- right -->
    <div class="p-toolbar-group-end">
        <p-button
            icon="pi pi-plus"
            [rounded]="true"
            [outlined]="true"
            severity="success"
            styleClass="p-1"
            (onClick)="openNewInvoice()"
        ></p-button>
    </div>
</p-toolbar>
