<p-toolbar>
    <ng-template pTemplate="start">
        <h2>
            Username:
            <span class="text-green-600">{{ loggedInUser() }}</span>
        </h2>
    </ng-template>
    <ng-template pTemplate="end">
        <p-button
            icon="pi pi-user-edit pi-fw"
            styleClass="p-button-primary"
            label="Change Username"
            (click)="toggleUserDialog(true)"
        ></p-button>
    </ng-template>
</p-toolbar>

<!-- change username modal -->
<p-dialog
    (onHide)="resetDialog()"
    header="Change Username"
    [(visible)]="userDialogVisible"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [draggable]="false"
    [resizable]="false"
    styleClass="p-fluid"
>
    <ng-template pTemplate="content">
        <form [formGroup]="userForm" (ngSubmit)="submitUsername()">
            <div class="field mt-1">
                <label for="username">New Username</label>
                <input
                    #username
                    pInputText
                    formControlName="new_username"
                    required
                    autofocus
                    spellcheck="false"
                    pKeyFilter="alpha"
                    [ngClass]="{
                        'ng-invalid ng-dirty':
                            new_username.invalid &&
                            (new_username.dirty ||
                                new_username.touched ||
                                submitted)
                    }"
                />
                <small
                    *ngIf="
                        new_username.invalid &&
                        (new_username.dirty ||
                            new_username.touched ||
                            submitted)
                    "
                    class="p-error"
                    >{{
                        new_username.errors["error"] ||
                            "this field is required!"
                    }}</small
                >
            </div>
        </form>
    </ng-template>

    <!-- footer -->
    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            label="Cancel"
            icon="pi pi-times"
            class="p-button-secondary"
            (click)="toggleUserDialog(false)"
        ></button>
        <button
            (click)="submitUsername()"
            pButton
            pRipple
            label="Save"
            icon="pi pi-check"
            class="p-button-success"
            [loading]="loading"
        ></button>
    </ng-template>
</p-dialog>
