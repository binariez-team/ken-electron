<p-toolbar>
    <ng-template pTemplate="start">
        <h2>Password</h2>
    </ng-template>
    <ng-template pTemplate="end">
        <p-button
            icon="pi pi-key"
            styleClass="p-button-secondary"
            label="Change Password"
            (click)="togglePassDialog(true)"
        ></p-button>
    </ng-template>
</p-toolbar>

<!-- change password modal -->
<p-dialog
    (onHide)="resetDialog()"
    header="Change Password"
    [(visible)]="passDialogVisible"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [draggable]="false"
    [resizable]="false"
    styleClass="p-fluid"
>
    <ng-template pTemplate="content">
        <form [formGroup]="passForm" (ngSubmit)="submitPassword()">
            <div class="formgrid grid">
                <!-- current password -->
                <div class="field col-12 md:col-12">
                    <label for="current_password">Current Password*</label>
                    <input
                        #currentPassword
                        type="password"
                        pInputText
                        formControlName="current_password"
                        required
                        autofocus
                        spellcheck="false"
                        [ngClass]="{
                            'ng-invalid ng-dirty':
                                current_password.invalid &&
                                (current_password.dirty ||
                                    current_password.touched ||
                                    submitted)
                        }"
                    />
                    <small
                        *ngIf="
                            current_password.invalid &&
                            (current_password.dirty ||
                                current_password.touched ||
                                submitted)
                        "
                        class="p-error"
                        >{{
                            current_password.errors["error"] ||
                                "this field is required!"
                        }}</small
                    >
                </div>

                <!-- New Password -->
                <div class="field col-12 md:col-6">
                    <label for="password">New Password*</label>
                    <input
                        type="password"
                        pInputText
                        formControlName="new_password"
                        required
                        spellcheck="false"
                        [ngClass]="{
                            'ng-invalid ng-dirty':
                                new_password.invalid &&
                                (new_password.dirty ||
                                    new_password.touched ||
                                    submitted)
                        }"
                    />
                    <small
                        *ngIf="
                            new_password.invalid &&
                            (new_password.dirty ||
                                new_password.touched ||
                                submitted)
                        "
                        class="p-error"
                        >{{
                            new_password.errors["error"] ||
                                "this field is required!"
                        }}</small
                    >
                </div>

                <!-- Confirm Password -->
                <div class="field col-12 md:col-6">
                    <label for="confirm_password">Confirm Password*</label>
                    <input
                        type="password"
                        pInputText
                        formControlName="confirm_password"
                        required
                        spellcheck="false"
                        [ngClass]="{
                            'ng-invalid ng-dirty':
                                confirm_password.invalid &&
                                (confirm_password.dirty ||
                                    confirm_password.touched ||
                                    submitted)
                        }"
                    />
                    <small
                        *ngIf="
                            confirm_password.invalid &&
                            (confirm_password.dirty ||
                                confirm_password.touched ||
                                submitted)
                        "
                        class="p-error"
                        >{{
                            confirm_password.errors["error"] ||
                                "this field is required!"
                        }}</small
                    >
                </div>
            </div>
        </form>
    </ng-template>

    <!-- footer -->
    <ng-template pTemplate="footer">
        <button
            pButton
            label="Cancel"
            icon="pi pi-times"
            class="p-button-secondary"
            (click)="togglePassDialog(false)"
        ></button>
        <button
            (click)="submitPassword()"
            pButton
            label="Save"
            icon="pi pi-check"
            class="p-button-success"
            [loading]="loading"
        ></button>
    </ng-template>
</p-dialog>
