<div class="grid m-1">
    <!-- Stock Management -->
    <div class="col-12 md:col-6 lg:col-4">
        <p-panel [toggleable]="true">
            <ng-template pTemplate="header">
                <h4 class="m-0">
                    <i class="pi pi-table pi-fw"></i> Quick Shortcuts
                </h4>
            </ng-template>
            <div class="grid">
                <div class="col-6">
                    <div
                        (click)="navigate('/order')"
                        class="surface-card shadow-2 p-3 border-round mt-2"
                    >
                        <div class="flex justify-content-between">
                            <div>
                                <h3 class="text-500 mt-2 mb-2">Orders</h3>
                            </div>
                            <div
                                class="flex align-items-center justify-content-center bg-green-100 border-round"
                                style="width: 2.5rem"
                            >
                                <i
                                    class="pi pi-truck text-green-500"
                                    style="font-size: 1.5rem"
                                ></i>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- navigate sell -->
                <div class="col-6">
                    <div
                        *ngIf="userType() === 'admin'"
                        (click)="navigate('/sell')"
                        class="surface-card shadow-2 p-3 border-round mt-2"
                    >
                        <div class="flex justify-content-between">
                            <div>
                                <h3 class="text-500 mt-2 mb-2">Sell</h3>
                            </div>
                            <div
                                class="flex align-items-center justify-content-center bg-blue-100 border-round"
                                style="width: 2.5rem"
                            >
                                <i
                                    class="pi pi-shopping-cart text-blue-500"
                                    style="font-size: 1.5rem"
                                ></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </p-panel>
    </div>
</div>
