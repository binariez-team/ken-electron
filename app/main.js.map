<div class="grid">
    <div class="col-12 lg:col-6 lg:col-offset-3">
        <div class="surface-card p-4 shadow-2 border-round w-full">
            <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
                <div class="text-center mb-5">
                    <img
                        src="assets/images/icon-250.png"
                        alt="Image"
                        height="50"
                        class="mb-3"
                    />
                    <div class="text-900 text-3xl font-medium mb-3">
                        Login to Continue
                    </div>
                </div>

                <div>
                    <label
                        for="username"
                        class="block text-900 font-medium mb-2"
                        >Username</label
                    >
                    <input
                        #username
                        id="username"
                        pInputText
                        formControlName="username"
                        placeholder="Username"
                        class="w-full mb-3"
                        spellcheck="false"
                    />

                    <label
                        for="password"
                        class="block text-900 font-medium mb-2"
                        >Password</label
                    >
                    <input
                        id="password"
                        type="password"
                        formControlName="password"
                        placeholder="Password"
                        pInputText
                        class="w-full mb-3"
                    />
                </div>

                <div class="text-center">
                    <!-- submit button -->
                    <p-button
                        *ngIf="!loader"
                        type="submit"
                        label="Login"
                        icon="pi pi-sign-in pi-fw"
                    ></p-button>

                    <!-- loader -->
                    <p-progressSpinner
                        *ngIf="loader"
                        styleClass="w-3rem h-3rem"
                    ></p-progressSpinner>
                </div>
            </form>

            <small>Current Version: {{ version }}</small>
        </div>
        <div class="flex justify-content-center mt-5">
            <p-button
                label="Update"
                severity="info"
                icon="pi pi-sync"
                (onClick)="updateApp()"
            >
            </p-button>
        </div>
    </div>
</div>

<p-toast key="login"></p-toast>
