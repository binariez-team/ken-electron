<p-menubar [model]="items" [autoDisplay]="false">
    <ng-template pTemplate="start">
        <img src="assets/images/kengroup.png" height="50" class="mx-4 my-2" />
    </ng-template>

    <ng-template pTemplate="end">
        <!-- <p-button
            #toggleMenu
            name="toggleMenu"
            styleClass="p-button-secondary"
            type="button"
            (click)="menu.toggle($event)"
            label="{{ loggedInUser() }}"
            icon="pi pi-cog"
            [text]="true"
        ></p-button> -->
        <p-button
            #toggleMenu
            name="toggleMenu"
            styleClass="p-button-secondary"
            type="button"
            (click)="menu.toggle($event)"
            label="{{ isOnline() ? loggedInUser() : 'Connecting' }}"
            [text]="true"
        >
            <i
                class="pi pi-fw mr-1"
                [ngClass]="{
                    'text-green-500 pi-circle-on': isOnline(),
                    'text-red-500 pi-spinner-dotted pi-spin': !isOnline()
                }"
            ></i
        ></p-button>
        <p-tieredMenu
            #menu
            [model]="subItems"
            [popup]="true"
            (onShow)="blur()"
        ></p-tieredMenu>
    </ng-template>
</p-menubar>
<p-breadcrumb
    class="max-w-full"
    [model]="breadcrumbs"
    [home]="{ icon: 'pi pi-home pi-fw' }"
></p-breadcrumb>

<!-- confirm dialog -->
<p-toast></p-toast>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
