<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stock</title>
        <link
            rel="stylesheet"
            href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="printStyle.css" />
        <script src="../node_modules/vue/dist/vue.global.js"></script>
    </head>
    <body id="app">
        <div class="container-fluid">
            <table class="table table-sm table-bordered text-center">
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Qty</th>
                        <th>Avg Cost</th>
                        <th>Price</th>
                        <th>TTC Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(record, index) in data" :key="index">
                        <td>{{ record.sku }}</td>
                        <td>{{ record.product_name }}</td>
                        <td>{{ record.category_name }}</td>
                        <td>{{ record.quantity }}</td>
                        <td>{{ formatCurrency(record.average_cost_usd) }}</td>
                        <td>{{ formatCurrency(record.unit_price_usd) }}</td>
                        <td>{{ formatCurrency(record.ttc_price) }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script>
            const { createApp, ref } = Vue;

            createApp({
                setup() {
                    const data = ref([]);

                    const formatCurrency = (value) => {
                        return new Intl.NumberFormat("en-US", {
                            style: "currency",
                            currency: "USD",
                        }).format(value || 0);
                    };

                    if (window.electron) {
                        window.electron.print((event, incomingData) => {
                            console.log(incomingData);
                            data.value = incomingData;
                        });
                    }

                    return {
                        data,
                        formatCurrency,
                    };
                },
            }).mount("#app");
        </script>
    </body>
</html>
